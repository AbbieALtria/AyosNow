services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py check_deploy_env &&
             gunicorn ayosnow.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ayosnow
      POSTGRES_USER: ayosnow
      POSTGRES_PASSWORD: ayosnow
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
